# Prueba aislada de Senda en GCP — PROYECTO EXCLUSIVO `senda-test`.
# Directorio: ~/senda-test (NO ~/AEGEN). Nombres y volúmenes exclusivos.
# Red: se adjunta a `aegen_magi_network` (externa ya existente;
# no se modifica nada de AEGEN). Comandos siempre con -f, -p y .env explícitos.
# Consumidor: `docker-compose` (el disponible en la VM). Sin campo `version:`,
# igual que el docker-compose.yml principal que ya funciona allí.

services:
  senda-test:
    build:
      context: ../../apps/entrenamiento
      dockerfile: Dockerfile
    container_name: senda_test_domain
    # SIN puertos publicados.
    environment:
      - UV_NO_SYNC=1
      - TZ=America/Bogota
      - SENDA_SYNC_TOKEN=${SENDA_SYNC_TOKEN:?falta en .env}
      - SENDA_CSRF_SECRET=${SENDA_CSRF_SECRET:?falta en .env}
      - GYM_LAN_SYNC_ONLY=1
      - GYM_SYNC_RATE_LIMIT_PER_MINUTE=${SENDA_RATE_LIMIT:-30}
    volumes:
      - senda_test_data:/app/data
    networks:
      - aegenlink
    restart: "no"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz',timeout=5).status==200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  tailscale-test:
    image: tailscale/tailscale@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    container_name: senda_test_tailscale
    network_mode: service:senda-test
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?falta en .env}
      - TS_EXTRA_ARGS=--advertise-tags=tag:senda-test --accept-dns --hostname=senda-test
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTH_ONCE=true
      - TS_USERSPACE=true
    volumes:
      - tailscale_test_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    restart: "no"
    # Usa containerboot oficial. Tras autenticar por primera vez, habilitar
    # Serve con: tailscale serve --bg --https=443 http://127.0.0.1:8000
    # Serve persiste en el volumen de estado; nunca habilitar Funnel.

networks:
  aegenlink:
    external: true
    name: aegen_magi_network

volumes:
  senda_test_data:
  tailscale_test_state:
