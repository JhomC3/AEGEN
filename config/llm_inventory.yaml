# Catálogo de llamadas LLM de AEGEN
# Permite modificar el enrutamiento de modelos en caliente

calls:
  chat_response:
    provider: google
    model: gemini-2.5-flash-lite
    temperature: 0.7
    key_rotation: true
    fallbacks:
      - provider: groq
        model: openai/gpt-oss-120b

  cbt_therapeutic_response:
    provider: google
    model: gemini-2.5-flash-lite
    temperature: 0.7
